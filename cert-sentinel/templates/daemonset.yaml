apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "cert-sentinel.fullname" . }}
  labels:
    {{- include "cert-sentinel.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "cert-sentinel.selectorLabels" . | nindent 6 }}
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        {{- include "cert-sentinel.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/script: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      # No API access of any kind. This pod cannot talk to Kubernetes.
      automountServiceAccountToken: false
      hostNetwork: false
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsUser: 0          # kubeconfigs under /etc/kubernetes are 0600 root
        runAsGroup: 0
      containers:
        - name: cert-sentinel
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              while true; do
                /bin/sh /scripts/check.sh
                sleep "${INTERVAL_SECONDS}"
              done
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: INTERVAL_SECONDS
              value: {{ .Values.intervalSeconds | quote }}
            - name: WARN_DAYS
              value: {{ .Values.thresholds.warnDays | quote }}
            - name: CRIT_DAYS
              value: {{ .Values.thresholds.criticalDays | quote }}
            {{- if .Values.kuma.enabled }}
            - name: KUMA_PUSH_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "cert-sentinel.fullname" . }}
                  key: kumaPushUrl
            {{- end }}
            {{- if .Values.telegram.enabled }}
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "cert-sentinel.fullname" . }}
                  key: telegramBotToken
            - name: TELEGRAM_CHAT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "cert-sentinel.fullname" . }}
                  key: telegramChatId
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: etc-kubernetes
              mountPath: /etc/kubernetes
              readOnly: true
            - name: var-lib-kubelet-pki
              mountPath: /var/lib/kubelet/pki
              readOnly: true
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: etc-kubernetes
          hostPath:
            path: /etc/kubernetes
            type: Directory
        - name: var-lib-kubelet-pki
          hostPath:
            path: /var/lib/kubelet/pki
            type: Directory
        - name: scripts
          configMap:
            name: {{ include "cert-sentinel.fullname" . }}
            defaultMode: 0555
        - name: tmp
          emptyDir: {}
