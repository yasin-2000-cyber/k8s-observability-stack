              },
              "expr": "100 - (avg by (instance) (rate(node_cpu_seconds_total{mode=\"idle\",instance=~\"$pg_instance\"}[5m])) * 100)",
              "legendFormat": "{{ "{{" }}instance{{ "}}" }}",
              "refId": "A"
            }
          ],
          "title": "CPU Usage %",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prom-db-primary"
          },
          "fieldConfig": {
            "defaults": {
              "max": 100,
