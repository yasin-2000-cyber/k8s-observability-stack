              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "${pg_datasource}"
              },
              "editorMode": "code",
              "format": "table",
              "rawQuery": true,
              "rawSql": "SELECT d.datname, left(CASE WHEN ${query_search:singlequote} = '' THEN s.query ELSE regexp_replace(s.query, '(' || ${query_search:singlequote} || ')', '\u00bb\\1\u00ab', 'gi') END, 200) AS query, s.calls, round(s.total_exec_time::numeric,1) AS total_ms, round(s.mean_exec_time::numeric,1) AS mean_ms, round(s.max_exec_time::numeric,1) AS max_ms, s.rows FROM pg_stat_statements s JOIN pg_database d ON d.oid = s.dbid WHERE d.datname IN (${pg_database:sqlstring}) AND (${query_search:singlequote} = '' OR s.query ILIKE '%' || ${query_search:singlequote} || '%') ORDER BY s.mean_exec_time DESC LIMIT 15;",
