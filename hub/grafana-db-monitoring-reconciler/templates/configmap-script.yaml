              "editorMode": "code",
              "format": "table",
              "rawQuery": true,
              "rawSql": "SELECT round(100.0 * count(*) / current_setting('max_connections')::int, 1) AS \"value\" FROM pg_stat_activity;",
              "refId": "A",
              "sql": {
                "columns": [],
                "groupBy": [],
                "limit": 50
              }
            }
