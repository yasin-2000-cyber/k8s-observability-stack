          "repeatDirection": "h",
          "targets": [
            {
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "${pg_datasource}"
              },
              "editorMode": "code",
              "format": "table",
              "rawQuery": true,
              "rawSql": "SELECT coalesce(state,'(none)') AS state, count(*) AS connections FROM pg_stat_activity WHERE datname IN (${pg_database:sqlstring}) GROUP BY state ORDER BY connections DESC;",
              "refId": "A",
              "sql": {
                "columns": [],
                "groupBy": [],
                "limit": 50
              }
            }
          ],
          "title": "Connections by State \u2014 ${pg_datasource}",
          "type": "table"
        },
        {
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 31
          },
          "id": 103,
          "panels": [],
          "title": "Top Databases by Connections (filter host above)",
          "type": "row"
        },
        {
          "datasource": {
            "type": "grafana-postgresql-datasource",
            "uid": "${pg_datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 32
          },
          "id": 8,
          "maxPerRow": 3,
          "repeat": "pg_datasource",
          "repeatDirection": "h",
          "targets": [
            {
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "${pg_datasource}"
              },
              "editorMode": "code",
              "format": "table",
              "rawQuery": true,
              "rawSql": "SELECT datname, count(*) AS connections FROM pg_stat_activity WHERE datname IN (${pg_database:sqlstring}) GROUP BY datname ORDER BY connections DESC LIMIT 10;",
              "refId": "A",
              "sql": {
                "columns": [],
                "groupBy": [],
                "limit": 50
              }
