        },
        {
          "datasource": {
            "type": "grafana-postgresql-datasource",
            "uid": "${pg_datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 23
          },
          "id": 7,
          "maxPerRow": 3,
