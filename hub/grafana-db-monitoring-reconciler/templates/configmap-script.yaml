apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-db-monitoring-reconciler-script
  namespace: monitoring
data:
  reconcile.sh: |
    #!/usr/bin/env bash
    set -euo pipefail

    GRAFANA_URL="{{ .Values.grafanaUrl }}"
    GRAFANA_AUTH="${GRAFANA_ADMIN_USER}:${GRAFANA_ADMIN_PASS}"

    # Fixed, hand-defined org — unlike grafana-org-reconciler this is NOT discovered
    # from live namespaces/Mimir tenants. Datasources for this org are provisioned
    # declaratively via hub/grafana/values.yaml (see the "DB-monitoring org"
    # section there), not by this script — this script only guards the org's
    # existence and keeps its dashboard(s) in sync with what's committed to git.
    DB_MONITORING_ORG_NAME="{{ .Values.orgName }}"

    # Dashboards kept in sync with the committed JSON files (one per DB cluster).
    DASHBOARD_JSON_FILES="/scripts/psql-cluster.json /scripts/mariadb-cluster-a.json /scripts/mariadb-cluster-b.json"

    # Dashboard uids to actively delete if present — orphan cleanup for a past
    # rename/retirement. The reconciler only upserts by each dashboard's *current*
    # uid, it never deletes one that disappears from the source, so an old uid
    # would otherwise stay live forever alongside its replacement. Empty by
    # default; populate via values.yaml's disallowedDashboardUids if needed.
    DISALLOWED_DASHBOARD_UIDS="{{ .Values.disallowedDashboardUids | join " " }}"

    # ── Helpers (same pattern as grafana-org-reconciler) ───────────────────────

    gapi() {
      local method="$1" path="$2" body="${3:-}"
      if [[ -n "$body" ]]; then
        curl -sf -X "$method" -u "$GRAFANA_AUTH" \
          -H "Content-Type: application/json" -d "$body" "${GRAFANA_URL}${path}"
      else
        curl -sf -X "$method" -u "$GRAFANA_AUTH" "${GRAFANA_URL}${path}"
      fi
    }

    gapi_org() {
      local org_id="$1" method="$2" path="$3" body="${4:-}"
      if [[ -n "$body" ]]; then
        curl -sf -X "$method" -u "$GRAFANA_AUTH" \
          -H "Content-Type: application/json" \
          -H "X-Grafana-Org-Id: ${org_id}" \
          -d "$body" "${GRAFANA_URL}${path}"
      else
        curl -sf -X "$method" -u "$GRAFANA_AUTH" \
          -H "X-Grafana-Org-Id: ${org_id}" "${GRAFANA_URL}${path}"
      fi
    }

    # ensure_org <org_name> → prints orgId
    ensure_org() {
      local org_name="$1"
      local encoded_name
      encoded_name=$(printf '%s' "$org_name" | jq -sRr @uri)

      local existing
      existing=$(gapi GET "/api/orgs/name/${encoded_name}" 2>/dev/null || echo '{}')

      if echo "$existing" | jq -e '.id' > /dev/null 2>&1; then
        echo "$existing" | jq -r '.id'
        return
      fi

      local result
      result=$(gapi POST "/api/orgs" "$(jq -n --arg name "$org_name" '{name: $name}')")
      echo "$result" | jq -r '.orgId'
    }

    # ensure_dashboard <org_id> <json_file> — upsert by the dashboard's own fixed uid
    ensure_dashboard() {
      local org_id="$1" json_file="$2"
      local body
      body=$(jq -n --slurpfile dashboard "$json_file" \
        '{dashboard: $dashboard[0], folderId: 0, overwrite: true}')
      gapi_org "$org_id" POST "/api/dashboards/db" "$body" > /dev/null
    }

    # cleanup_disallowed_dashboards <org_id>
    cleanup_disallowed_dashboards() {
      local org_id="$1"
      for uid in $DISALLOWED_DASHBOARD_UIDS; do
        local exists
        exists=$(gapi_org "$org_id" GET "/api/dashboards/uid/${uid}" 2>/dev/null \
          | jq -r '.dashboard.id // empty' || true)
        if [[ -n "$exists" ]]; then
          echo "[db-monitoring-reconcile] deleting orphaned dashboard ${uid}"
          gapi_org "$org_id" DELETE "/api/dashboards/uid/${uid}" > /dev/null || true
        fi
      done
    }

    # ── Main ─────────────────────────────────────────────────────────────────

    echo "[db-monitoring-reconcile] starting"

    org_id=$(ensure_org "$DB_MONITORING_ORG_NAME")
    echo "[db-monitoring-reconcile] org: ${DB_MONITORING_ORG_NAME} (orgId=${org_id})"

    cleanup_disallowed_dashboards "$org_id"

    for f in $DASHBOARD_JSON_FILES; do
      ensure_dashboard "$org_id" "$f"
      echo "[db-monitoring-reconcile] dashboard synced (${f})"
    done

    echo "[db-monitoring-reconcile] finished"
