# ── Persistence ───────────────────────────────────────────────────────────────
# Disabled on purpose: Alertmanager's nflog/silences state is small and disposable.
# A PVC backed by a storage class that becomes degraded or unavailable can wedge
# Alertmanager's maintenance ticker, so an emptyDir (no PVC) is safer for prod
# reliability than persisting this state.
persistence:
  enabled: false

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 200m
    # Raised from 256Mi: the lower limit caused repeated OOMKills under bursty alert volume.
    memory: 512Mi

# ── AlertManager config ───────────────────────────────────────────────────────
# ${SMTP_PASSWORD} is substituted at pod startup by the config-renderer init container
# below. The Teams webhook URL is read directly from the mounted secret file
# (msteamsv2_configs webhook_url_file) — no sed substitution needed for it.
# Store both in a Kubernetes Secret named monitoring-alertmanager-credentials:
#   kubectl create secret generic monitoring-alertmanager-credentials -n monitoring \
#     --from-literal=SMTP_PASSWORD=<your-smtp-password> \
#     --from-literal=teams_webhook_url=<your-teams-incoming-webhook-url>   # optional
config:
  enabled: true
  global:
    resolve_timeout: 5m
    smtp_from: "alerts@example.com"                  # replace with your sender address
    smtp_smarthost: "smtp.office365.com:587"         # replace with your SMTP server
    # If your provider deprecates SMTP basic-auth (as Microsoft is doing for Office365),
    # a drop-in relay alternative is SendGrid: smarthost "smtp.sendgrid.net:587",
    # username literally the string "apikey", password = your SendGrid API key.
    smtp_auth_username: "alerts@example.com"         # replace with your SMTP username
    smtp_auth_password: ${SMTP_PASSWORD}
    smtp_require_tls: true
  route:
    group_by: ["alertname", "cluster", "namespace"]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    receiver: "email-default"
    routes:
      # Example: mute a noisy/low-priority cluster entirely (no email, no Teams).
      # Matched first, no fallthrough — replace "spoke-1" with the cluster to mute.
      - match:
          cluster: spoke-1
        receiver: "blackhole"
      # Alternative example: mute a known-noisy or intentionally-disabled workload by
      # namespace instead of by cluster — useful when the workload can run on any
      # cluster (a different axis than the cluster-based mute above).
      # - match:
      #     namespace: <YOUR_NAMESPACE>
      #   receiver: "blackhole"
      - match:
          severity: critical
        receiver: "email-critical"
        continue: true
      - match:
          severity: warning
        receiver: "email-default"
  receivers:
    - name: "email-default"
      email_configs:
        - to: "admin@example.com,ops@example.com"   # replace with your alert recipients
          send_resolved: true
      msteamsv2_configs:
        - webhook_url_file: /etc/alertmanager-secrets/teams_webhook_url
          send_resolved: true
          title: '[{{ .CommonLabels.severity }}] {{ .CommonLabels.alertname }}'
          text: |
            **Cluster:** {{ .CommonLabels.cluster }}
            **Namespace:** {{ .CommonLabels.namespace }}
            {{ range .Alerts }}{{ .Annotations.description }}
            {{ end }}
    - name: "email-critical"
      email_configs:
        - to: "admin@example.com,ops@example.com"
          send_resolved: true
      msteamsv2_configs:
        - webhook_url_file: /etc/alertmanager-secrets/teams_webhook_url
          send_resolved: true
          title: '[CRITICAL] {{ .CommonLabels.alertname }}'
          text: |
            **Cluster:** {{ .CommonLabels.cluster }}
            **Namespace:** {{ .CommonLabels.namespace }}
            {{ range .Alerts }}{{ .Annotations.description }}
            {{ end }}
    - name: "blackhole"
  inhibit_rules:
    - source_match:
        severity: critical
      target_match:
        severity: warning
      equal: ["alertname", "cluster", "namespace"]

# ── Init container: substitute ${SMTP_PASSWORD} at startup ────────────────────
extraInitContainers:
  - name: config-renderer
    image: busybox:1.36
    command:
      - sh
      - -c
      - >-
        sed "s|\${SMTP_PASSWORD}|${SMTP_PASSWORD}|g"
        /etc/alertmanager-src/alertmanager.yml
        > /etc/alertmanager-rendered/alertmanager.yml
    env:
      - name: SMTP_PASSWORD
        valueFrom:
          secretKeyRef:
            name: monitoring-alertmanager-credentials
            key: SMTP_PASSWORD
    volumeMounts:
      - name: config
        mountPath: /etc/alertmanager-src
        readOnly: true
      - name: alertmanager-rendered
        mountPath: /etc/alertmanager-rendered

extraVolumes:
  - name: alertmanager-rendered
    emptyDir: {}

extraVolumeMounts:
  - name: alertmanager-rendered
    mountPath: /etc/alertmanager-rendered

extraArgs:
  config.file: /etc/alertmanager-rendered/alertmanager.yml

# ── Ingress ───────────────────────────────────────────────────────────────────
ingress:
  enabled: true
  className: nginx
  hosts:
    - host: hub-alertmanager.<YOUR_DOMAIN>
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: hub-alertmanager-tls
      hosts:
        - hub-alertmanager.<YOUR_DOMAIN>
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    external-dns.alpha.kubernetes.io/target: "<YOUR_EXTERNAL_IP>"
