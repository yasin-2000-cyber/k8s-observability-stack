# ── Credentials — inject from a Kubernetes Secret ────────────────────────────
# Create a Secret named monitoring-mimir-s3 with keys:
#   S3_ACCESS_KEY, S3_SECRET_KEY, S3_ENDPOINT
# Example:
#   kubectl create secret generic monitoring-mimir-s3 -n monitoring \
#     --from-literal=S3_ENDPOINT=<YOUR_S3_ENDPOINT> \
#     --from-literal=S3_ACCESS_KEY=<YOUR_ACCESS_KEY> \
#     --from-literal=S3_SECRET_KEY=<YOUR_SECRET_KEY>
global:
  # CoreDNS ClusterIP — run: kubectl get svc -n kube-system kube-dns
  # v5.5.0+ removed the custom-resolver conditional from the nginx configmap template;
  # this dnsService value is the only thing controlling the resolver line now. The
  # trailing "#" comments out the FQDN suffix nginx would otherwise append, which is
  # invalid syntax for this directive.
  # Rendered result: resolver 10.96.0.10 valid=30s ipv6=off; #.kube-system.svc.cluster.local.;
  dnsService: "10.96.0.10 valid=30s ipv6=off; #"
  extraEnvFrom:
    - secretRef:
        name: monitoring-mimir-s3
  extraArgs:
    config.expand-env: "true"

mimir:
  structuredConfig:
    multitenancy_enabled: true

    tenant_federation:
      enabled: true

    # S3 storage — credentials from env vars
    common:
      storage:
        backend: s3
        s3:
          endpoint: ${S3_ENDPOINT}
          access_key_id: ${S3_ACCESS_KEY}
          secret_access_key: ${S3_SECRET_KEY}
          region: us-east-1
          bucket_lookup_type: path
          insecure: false

    blocks_storage:
      backend: s3
      s3:
        bucket_name: mimir-blocks   # rename to match your S3 bucket
      tsdb:
        block_ranges_period:
          - 10m
        # Ship blocks to S3 every 10m instead of Mimir's 2h default: this bounds the
        # window of unshipped data lost if an ingester pod is rescheduled/lost.
        # retention_period lowered from Mimir's stock 13h default so the ingester's
        # local disk doesn't fill with blocks that have already been shipped to S3.
        # 4h stays safely above store-gateway's bucket-store.sync-interval (15m default),
        # so store-gateway has already discovered a block long before the ingester
        # drops its local copy.
        retention_period: 4h

    ruler_storage:
      backend: s3
      s3:
        bucket_name: mimir-ruler

    alertmanager_storage:
      backend: s3
      s3:
        bucket_name: mimir-alertmanager

    compactor:
      data_dir: /data/compactor

    ruler:
      rule_path: /data/ruler-rules

    ingester_client:
      grpc_client_config:
        grpc_compression: snappy

    ingester:
      ring:
        # replication_factor 1 -> 3: with RF=1, every series has exactly one
        # owning ingester, so losing that single pod blacks out the write path
        # for every federated tenant at once ("at least 1 live replicas
        # required, could only find 0"). RF=3 with 5 ingesters means a write
        # needs quorum (2 of 3) acks, so any single ingester restarting no
        # longer stalls ingestion.
        replication_factor: 3

    limits:
      compactor_blocks_retention_period: 90d
      ingestion_rate: 50000
      ingestion_burst_size: 500000
      max_global_series_per_user: 2000000

# ── Component replicas — single replica each, except ingester (HA, see below) ─
ingester:
  replicas: 5
  zoneAwareReplication:
    enabled: false
  # Still no PVC — with RF=3 replication in place, durability comes from the
  # other 2 replicas holding each series rather than from local disk.
  # block_ranges_period is 10m, so an emptyDir still bounds worst-case
  # unshipped-sample loss on any one pod's reschedule to ~10-15min, and quorum
  # means that loss no longer surfaces to queries.
  persistentVolume:
    enabled: false
  # Resources doubled alongside the 1->5 replica HA change.
  resources:
    requests:
      cpu: 1000m
      memory: 2Gi
    limits:
      memory: 32Gi   # ingester is the most memory-hungry component; no CPU limit to avoid throttling under load

distributor:
  replicas: 1
  resources:
    requests:
      cpu: 200m
      memory: 1Gi
    limits:
      memory: 4Gi

querier:
  replicas: 1
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

query_frontend:
  replicas: 1
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 5
    targetMemoryUtilizationPercentage: 80
  resources:
    requests:
      cpu: 200m
      memory: 1Gi
    limits:
      memory: 3Gi

store_gateway:
  replicas: 1
  zoneAwareReplication:
    enabled: false
  persistentVolume:
    enabled: false
  # limits.memory raised from 1Gi: a single-replica store-gateway can OOM while
  # reloading index-headers once you have several federated tenants at longer
  # retention, and because it's single-replica, each OOM breaks historical
  # queries for every tenant until it resyncs.
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 8Gi

compactor:
  replicas: 1
  persistentVolume:
    enabled: false
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

ruler:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# ── Disable caches — not needed at small scale ───────────────────────────────
chunks-cache:
  enabled: false
index-cache:
  enabled: false
metadata-cache:
  enabled: false
results-cache:
  enabled: false

# ── Disable built-in alertmanager — use standalone component ─────────────────
alertmanager:
  enabled: false

# ── Disable embedded MinIO — use external S3 ─────────────────────────────────
minio:
  enabled: false

# ── NGINX gateway ─────────────────────────────────────────────────────────────
nginx:
  enabled: true
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts:
      - host: hub-mimir.<YOUR_DOMAIN>
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: hub-mimir-tls
        hosts:
          - hub-mimir.<YOUR_DOMAIN>
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt
      nginx.ingress.kubernetes.io/proxy-body-size: "32m"
      external-dns.alpha.kubernetes.io/target: "<YOUR_EXTERNAL_IP>"
