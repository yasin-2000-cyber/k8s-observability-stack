deploymentStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

replicas: 1

podDisruptionBudget:
  minAvailable: 1

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
          topologyKey: kubernetes.io/hostname

image:
  pullPolicy: IfNotPresent

# ── No PVC — PostgreSQL backend ───────────────────────────────────────────────
persistence:
  enabled: false

resources:
  requests:
    cpu: 200m
    memory: 1Gi
  limits:
    memory: 4Gi

# ── Credentials — from a Kubernetes Secret ────────────────────────────────────
# Create a Secret named monitoring-grafana-secret containing:
#   AZURE_CLIENT_ID, AZURE_CLIENT_SECRET, AZURE_TENANT_ID (for SSO)
#   DB_HOST, DB_NAME, DB_USER, DB_PASSWORD (for PostgreSQL backend)
# Example:
#   kubectl create secret generic monitoring-grafana-secret -n monitoring \
#     --from-literal=AZURE_CLIENT_ID=<your-client-id> \
#     --from-literal=AZURE_CLIENT_SECRET=<your-client-secret> \
#     --from-literal=AZURE_TENANT_ID=<your-tenant-id> \
#     --from-literal=DB_HOST=<your-postgres-host> \
#     --from-literal=DB_NAME=grafana \
#     --from-literal=DB_USER=grafana \
#     --from-literal=DB_PASSWORD=<your-db-password>
envFromSecret: monitoring-grafana-secret

# SMTP_PASSWORD sourced from the same secret Alertmanager uses (created out-of-band, not in git)
envValueFrom:
  SMTP_PASSWORD:
    secretKeyRef:
      name: monitoring-alertmanager-credentials
      key: SMTP_PASSWORD
  # Postgres monitoring-role credentials, used by the DB-monitoring org's native
  # PostgreSQL datasources below (a read-only role, e.g. a member of
  # pg_monitor/pg_read_all_stats — not superuser). Create
  # monitoring-postgres-exporter-secret out-of-band, not in git:
  #   kubectl create secret generic monitoring-postgres-exporter-secret -n monitoring \
  #     --from-literal=POSTGRES_EXPORTER_USER=<your-readonly-user> \
  #     --from-literal=POSTGRES_EXPORTER_PASSWORD=<your-readonly-password>
  POSTGRES_EXPORTER_USER:
    secretKeyRef:
      name: monitoring-postgres-exporter-secret
      key: POSTGRES_EXPORTER_USER
  POSTGRES_EXPORTER_PASSWORD:
    secretKeyRef:
      name: monitoring-postgres-exporter-secret
      key: POSTGRES_EXPORTER_PASSWORD

# ── Grafana configuration ─────────────────────────────────────────────────────
grafana.ini:
  server:
    domain: hub-grafana.<YOUR_DOMAIN>
    root_url: https://hub-grafana.<YOUR_DOMAIN>
    serve_from_sub_path: false

  analytics:
    reporting_enabled: false
    check_for_updates: false

  # PostgreSQL database backend — credentials from envFromSecret
  database:
    type: postgres
    host: ${DB_HOST}
    name: ${DB_NAME}
    user: ${DB_USER}
    password: ${DB_PASSWORD}
    ssl_mode: disable

  auth:
    disable_login_form: false
    oauth_auto_login: false

  # Microsoft Azure AD SSO — credentials from envFromSecret
  # Remove this section if you are not using Azure AD
  auth.azuread:
    name: Microsoft
    enabled: true
    allow_sign_up: true
    auto_login: false
    client_id: ${AZURE_CLIENT_ID}
    client_secret: ${AZURE_CLIENT_SECRET}
    scopes: openid email profile
    auth_url: https://login.microsoftonline.com/${AZURE_TENANT_ID}/oauth2/v2.0/authorize
    token_url: https://login.microsoftonline.com/${AZURE_TENANT_ID}/oauth2/v2.0/token
    allowed_domains: ""
    # Restrict login to specific Azure AD group OIDs (comma-separated).
    # Find group OIDs in Azure AD → Groups → your group → Object ID.
    allowed_groups: "<AZURE_AD_GROUP_OID_1>,<AZURE_AD_GROUP_OID_2>"
    org_mapping: ""
    role_attribute_path: ""
    role_attribute_strict: false
    allow_assign_grafana_admin: true
    skip_org_role_sync: true

  security:
    admin_user: admin

  explore:
    enabled: true

  users:
    auto_assign_org: true
    auto_assign_org_id: 1
    auto_assign_org_role: Viewer
    viewers_can_edit: false

  # Grafana's own SMTP delivery (separate from Alertmanager's) — used for report/alert
  # emails sent directly by Grafana rather than routed through Alertmanager.
  smtp:
    enabled: true
    host: smtp.office365.com:587       # replace with your SMTP server
    user: alerts@example.com           # replace with your SMTP username
    password: ${SMTP_PASSWORD}
    from_address: alerts@example.com   # replace with your sender address
    from_name: Grafana Alerts
    startTLS_policy: MandatoryStartTLS

  unified_alerting:
    enabled: true

  dashboards:
    versions_to_keep: 20

# ── Admin credentials — from a manually-created Kubernetes Secret ─────────────
# Run before deploying:
#   kubectl create secret generic grafana-admin-secret -n monitoring \
#     --from-literal=admin-user=admin \
#     --from-literal=admin-password=<strong-random-password>
admin:
  existingSecret: grafana-admin-secret
  userKey: admin-user
  passwordKey: admin-password

# ── Pre-configured datasources ────────────────────────────────────────────────
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:

      # Mimir — multi-tenant metrics
      # Update httpHeaderValue1 to pipe-separate all your cluster tenant names
      - name: Mimir
        type: prometheus
        uid: mimir
        url: http://mimir-nginx.monitoring.svc.cluster.local:80/prometheus
        isDefault: true
        jsonData:
          httpMethod: POST
          httpHeaderName1: "X-Scope-OrgID"
          manageAlerts: false
        secureJsonData:
          httpHeaderValue1: "hub|spoke-1|spoke-2"   # pipe-separated list of all cluster tenant names

      # Loki — multi-tenant logs
      - name: Loki
        type: loki
        uid: loki
        url: http://loki-gateway.monitoring.svc.cluster.local:80
        jsonData:
          httpHeaderName1: "X-Scope-OrgID"
          derivedFields:
            - datasourceUid: tempo
              matcherRegex: '"(?:@tr|trace_id|TraceId)":\s*"([a-f0-9]{32})"'
              name: TraceID
              url: "$${__value.raw}"
              urlDisplayLabel: "View Trace in Tempo"
            - datasourceUid: tempo
              matcherRegex: 'traceId=([a-f0-9]{32})'
              name: TraceID_plain
              url: "$${__value.raw}"
              urlDisplayLabel: "View Trace in Tempo"
        secureJsonData:
          httpHeaderValue1: "hub|spoke-1|spoke-2"   # pipe-separated list of all cluster tenant names

      # Tempo — multi-tenant traces
      - name: Tempo
        type: tempo
        uid: tempo
        url: http://tempo.monitoring.svc.cluster.local:3200
        jsonData:
          httpHeaderName1: "X-Scope-OrgID"
          tracesToLogsV2:
            datasourceUid: loki
            filterByTraceID: true
            filterBySpanID: false
            customQuery: false
            spanStartTimeShift: "-1m"
            spanEndTimeShift: "1m"
            tags:
              - key: k8s.namespace.name
                value: namespace
              - key: k8s.pod.name
                value: pod
              - key: service.name
                value: app
          serviceMap:
            datasourceUid: mimir
          nodeGraph:
            enabled: true
        secureJsonData:
          httpHeaderValue1: "hub|spoke-1|spoke-2"   # pipe-separated list of all cluster tenant names

      # Mimir Hub — span metrics from Tempo metricsGenerator (hub tenant only)
      - name: Mimir Hub
        type: prometheus
        uid: mimir-hub
        url: http://mimir-nginx.monitoring.svc.cluster.local:80/prometheus
        jsonData:
          httpMethod: POST
          httpHeaderName1: "X-Scope-OrgID"
        secureJsonData:
          httpHeaderValue1: "hub"   # hub cluster tenant name

      # Alertmanager — view/silence alerts + delivery for Grafana-managed alerts
      - name: Alertmanager
        type: alertmanager
        uid: alertmanager
        url: http://alertmanager-monitoring.monitoring.svc.cluster.local:9093
        jsonData:
          implementation: prometheus
          handleGrafanaManagedAlerts: true

      # ── DB-monitoring org ──────────────────────────────────────────────────
      # A separate, fixed, hand-defined Grafana org — NOT one of the per-namespace
      # orgs grafana-org-reconciler discovers/manages dynamically. Its existence
      # and its 3 dashboards are kept in sync by hub/grafana-db-monitoring-reconciler;
      # the datasources below are provisioned declaratively here instead, since this
      # org's shape (one fixed org, hand-picked dashboards) never changes at runtime.
      #
      # Grafana assigns this org's numeric id when it's first created (e.g. via the
      # reconciler's POST /api/orgs call) — query it with
      # `GET /api/orgs/name/DB-monitoring` afterwards and substitute the id below.
      # It is whatever your instance actually assigns, not a fixed convention to
      # hardcode ahead of time.
      #
      # Native Postgres datasources, one per cluster node, using a read-only
      # monitoring role (e.g. a member of pg_monitor/pg_read_all_stats — not
      # superuser). jsonData.database MUST be set in addition to the top-level
      # database field — the query editor's frontend reads jsonData.database
      # specifically; without it every panel silently shows "No data" even though
      # the connection itself works and the backend query succeeds.
      #
      # To add another Postgres cluster node: copy one PSQL0X block below, point
      # it at the new host, give it a new uid, and reuse/extend
      # monitoring-postgres-exporter-secret for its credentials. No dashboard JSON
      # change is needed — the psql-cluster dashboard's "Host (DB connections)"
      # filter is a Grafana datasource-type variable that lists every
      # postgres-type datasource in this org automatically.
      - name: "PSQL01 (<YOUR_PSQL_HOST_1>)"
        type: postgres
        uid: psql01-pg
        orgId: <YOUR_DB_MONITORING_ORG_ID>
        url: <YOUR_PSQL_HOST_1>:5432
        user: ${POSTGRES_EXPORTER_USER}
        database: postgres
        jsonData:
          sslmode: disable
          postgresVersion: 1700
          timescaledb: false
          database: postgres
        secureJsonData:
          password: ${POSTGRES_EXPORTER_PASSWORD}

      - name: "PSQL02 (<YOUR_PSQL_HOST_2>)"
        type: postgres
        uid: psql02-pg
        orgId: <YOUR_DB_MONITORING_ORG_ID>
        url: <YOUR_PSQL_HOST_2>:5432
        user: ${POSTGRES_EXPORTER_USER}
        database: postgres
        jsonData:
          sslmode: disable
          postgresVersion: 1700
          timescaledb: false
          database: postgres
        secureJsonData:
          password: ${POSTGRES_EXPORTER_PASSWORD}

      - name: "PSQL03 (<YOUR_PSQL_HOST_3>)"
        type: postgres
        uid: psql03-pg
        orgId: <YOUR_DB_MONITORING_ORG_ID>
        url: <YOUR_PSQL_HOST_3>:5432
        user: ${POSTGRES_EXPORTER_USER}
        database: postgres
        jsonData:
          sslmode: disable
          postgresVersion: 1700
          timescaledb: false
          database: postgres
        secureJsonData:
          password: ${POSTGRES_EXPORTER_PASSWORD}

      # Node-level (node_exporter) + postgres_exporter metrics, scraped by your
      # primary Prometheus instance — used by the psql-cluster dashboard's "Node
      # Live Metrics" row (host CPU/memory/disk/network, which Postgres SQL
      # itself can't expose).
      - name: "Prometheus (DB-Monitoring Primary)"
        type: prometheus
        uid: prom-db-primary
        orgId: <YOUR_DB_MONITORING_ORG_ID>
        url: http://<YOUR_PROMETHEUS_HOST>:9090
        isDefault: true
        jsonData:
          httpMethod: POST

      # MariaDB clusters — node_exporter + mysqld_exporter, scraped by a second,
      # separate Prometheus instance from the one above. Used by the MariaDB
      # dashboards' "Node Live Metrics" rows.
      - name: "Prometheus (DB-Monitoring Secondary)"
        type: prometheus
        uid: prom-db-secondary
        orgId: <YOUR_DB_MONITORING_ORG_ID>
        url: http://<YOUR_SECONDARY_PROMETHEUS_HOST>:9090
        isDefault: false
        jsonData:
          httpMethod: POST

# ── Dashboard sidecar — auto-loads ConfigMaps labeled grafana_dashboard=1 ─────
sidecar:
  dashboards:
    enabled: true
    label: grafana_dashboard
    labelValue: "1"
    folder: /var/lib/grafana/dashboards/hub
    searchNamespace: ALL
    folderAnnotation: grafana_folder
    provider:
      allowUiUpdates: true
      foldersFromFilesStructure: true
  datasources:
    enabled: false

# ── Alert Rules ───────────────────────────────────────────────────────────────
alerting:
  contactpoints.yaml:
    apiVersion: 1
    contactPoints:
      - orgId: 1
        name: alertmanager
        receivers:
          - uid: alertmanager-cp
            type: prometheus-alertmanager
            settings:
              url: http://alertmanager-monitoring.monitoring.svc.cluster.local:9093

  policies.yaml:
    apiVersion: 1
    policies:
      - orgId: 1
        receiver: alertmanager
        group_by: [alertname, cluster, namespace]
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 4h

  alert-rules.yaml:
    apiVersion: 1
    groups:

      # ── K8s Node Health ──────────────────────────────────────────────────────
      - orgId: 1
        name: k8s-nodes
        folder: Infrastructure
        interval: 1m
        rules:
          - uid: k8s-node-cpu-high
            title: "Node CPU High (>85%)"
            condition: C
            noDataState: NoData
            execErrState: Error
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: 'Node CPU High: {{ "{{" }} $labels.cluster {{ "}}" }} / {{ "{{" }} $labels.node {{ "}}" }}'
              description: 'Cluster: {{ "{{" }} $labels.cluster {{ "}}" }} | Node: {{ "{{" }} $labels.node {{ "}}" }} — CPU usage exceeded 85%, check node-level workloads'
            data:
              - refId: A
                relativeTimeRange: {from: 600, to: 0}
                datasourceUid: mimir
                model:
                  expr: '1 - avg by (cluster, node) (rate(node_cpu_seconds_total{mode="idle"}[5m]))'
                  instant: true
                  range: false
                  refId: A
              - refId: C
                relativeTimeRange: {from: 0, to: 0}
                datasourceUid: __expr__
                model:
                  type: threshold
                  refId: C
                  expression: A
                  conditions:
                    - evaluator: {params: [0.85], type: gt}
                      operator: {type: and}
                      query: {params: [A]}
                      reducer: {params: [], type: last}

          - uid: k8s-node-mem-high
            title: "Node Memory High (>90%)"
            condition: C
            noDataState: NoData
            execErrState: Error
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: 'Node Memory High: {{ "{{" }} $labels.cluster {{ "}}" }} / {{ "{{" }} $labels.instance {{ "}}" }}'
              description: 'Cluster: {{ "{{" }} $labels.cluster {{ "}}" }} | Instance: {{ "{{" }} $labels.instance {{ "}}" }} — Memory usage exceeded 90%, consider evicting or rescheduling pods'
            data:
              - refId: A
                relativeTimeRange: {from: 600, to: 0}
                datasourceUid: mimir
                model:
                  expr: '1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)'
                  instant: true
                  range: false
                  refId: A
              - refId: C
                relativeTimeRange: {from: 0, to: 0}
                datasourceUid: __expr__
                model:
                  type: threshold
                  refId: C
                  expression: A
                  conditions:
                    - evaluator: {params: [0.90], type: gt}
                      operator: {type: and}
                      query: {params: [A]}
                      reducer: {params: [], type: last}

          - uid: k8s-node-disk-high
            title: "Node Disk High (>80%)"
            condition: C
            noDataState: NoData
            execErrState: Error
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: 'Node Disk High: {{ "{{" }} $labels.cluster {{ "}}" }} / {{ "{{" }} $labels.instance {{ "}}" }}'
              description: 'Cluster: {{ "{{" }} $labels.cluster {{ "}}" }} | Instance: {{ "{{" }} $labels.instance {{ "}}" }} — Disk usage exceeded 80%, check mountpoint usage and clean up'
            data:
              - refId: A
                relativeTimeRange: {from: 600, to: 0}
                datasourceUid: mimir
                model:
                  expr: '1 - (node_filesystem_avail_bytes{fstype!="tmpfs",fstype!="overlay"} / node_filesystem_size_bytes{fstype!="tmpfs",fstype!="overlay"})'
                  instant: true
                  range: false
                  refId: A
              - refId: C
                relativeTimeRange: {from: 0, to: 0}
                datasourceUid: __expr__
                model:
                  type: threshold
                  refId: C
                  expression: A
                  conditions:
                    - evaluator: {params: [0.80], type: gt}
                      operator: {type: and}
                      query: {params: [A]}
                      reducer: {params: [], type: last}

          - uid: k8s-node-not-ready
            title: "Node Not Ready"
            condition: C
            noDataState: NoData
            execErrState: Error
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: 'Node Not Ready: {{ "{{" }} $labels.cluster {{ "}}" }} / {{ "{{" }} $labels.node {{ "}}" }}'
              description: 'Cluster: {{ "{{" }} $labels.cluster {{ "}}" }} | Node: {{ "{{" }} $labels.node {{ "}}" }} — NotReady for 2m, check kubelet and node health'
            data:
              - refId: A
                relativeTimeRange: {from: 300, to: 0}
                datasourceUid: mimir
                model:
                  expr: 'kube_node_status_condition{condition="Ready",status="true"}'
                  instant: true
                  range: false
                  refId: A
              - refId: C
                relativeTimeRange: {from: 0, to: 0}
                datasourceUid: __expr__
                model:
                  type: threshold
                  refId: C
                  expression: A
                  conditions:
                    - evaluator: {params: [1], type: lt}
                      operator: {type: and}
                      query: {params: [A]}
                      reducer: {params: [], type: last}

      # ── K8s Pod Health ───────────────────────────────────────────────────────
      - orgId: 1
        name: k8s-pods
        folder: Infrastructure
        interval: 1m
        rules:
          - uid: k8s-pod-crashloop
            title: "Pod CrashLoopBackOff"
            condition: C
            noDataState: NoData
            execErrState: Error
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: 'Pod CrashLoopBackOff: {{ "{{" }} $labels.pod {{ "}}" }} ({{ "{{" }} $labels.namespace {{ "}}" }})'
              description: 'Cluster: {{ "{{" }} $labels.cluster {{ "}}" }} | Namespace: {{ "{{" }} $labels.namespace {{ "}}" }} | Pod: {{ "{{" }} $labels.pod {{ "}}" }} — CrashLoopBackOff for 5m, check pod logs'
            data:
              - refId: A
                relativeTimeRange: {from: 600, to: 0}
                datasourceUid: mimir
                model:
                  expr: 'kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"}'
                  instant: true
                  range: false
                  refId: A
              - refId: C
                relativeTimeRange: {from: 0, to: 0}
                datasourceUid: __expr__
                model:
                  type: threshold
                  refId: C
                  expression: A
                  conditions:
                    - evaluator: {params: [0], type: gt}
                      operator: {type: and}
                      query: {params: [A]}
                      reducer: {params: [], type: last}

          - uid: k8s-pod-oom
            title: "Pod OOMKilled"
            condition: C
            noDataState: NoData
            execErrState: Error
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: 'Pod OOMKilled: {{ "{{" }} $labels.pod {{ "}}" }} ({{ "{{" }} $labels.namespace {{ "}}" }})'
              description: 'Cluster: {{ "{{" }} $labels.cluster {{ "}}" }} | Namespace: {{ "{{" }} $labels.namespace {{ "}}" }} | Pod: {{ "{{" }} $labels.pod {{ "}}" }} | Container: {{ "{{" }} $labels.container {{ "}}" }} — Container was killed due to out-of-memory. Increase memory limits or check for memory leaks.'
            data:
              - refId: A
                relativeTimeRange: {from: 300, to: 0}
                datasourceUid: mimir
                model:
                  expr: 'kube_pod_container_status_last_terminated_reason{reason="OOMKilled"}'
                  instant: true
                  range: false
                  refId: A
              - refId: C
                relativeTimeRange: {from: 0, to: 0}
                datasourceUid: __expr__
                model:
                  type: threshold
                  refId: C
                  expression: A
                  conditions:
                    - evaluator: {params: [0], type: gt}
                      operator: {type: and}
                      query: {params: [A]}
                      reducer: {params: [], type: last}

          - uid: k8s-pod-pending
            title: "Pod Pending Too Long (>5m)"
            condition: C
            noDataState: NoData
            execErrState: Error
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: 'Pod Pending: {{ "{{" }} $labels.pod {{ "}}" }} ({{ "{{" }} $labels.namespace {{ "}}" }})'
              description: 'Cluster: {{ "{{" }} $labels.cluster {{ "}}" }} | Namespace: {{ "{{" }} $labels.namespace {{ "}}" }} | Pod: {{ "{{" }} $labels.pod {{ "}}" }} — Pending for 5m, check node resources or PVC binding'
            data:
              - refId: A
                relativeTimeRange: {from: 600, to: 0}
                datasourceUid: mimir
                model:
                  expr: 'kube_pod_status_phase{phase="Pending"}'
                  instant: true
                  range: false
                  refId: A
              - refId: C
                relativeTimeRange: {from: 0, to: 0}
                datasourceUid: __expr__
                model:
                  type: threshold
                  refId: C
                  expression: A
                  conditions:
                    - evaluator: {params: [0], type: gt}
                      operator: {type: and}
                      query: {params: [A]}
                      reducer: {params: [], type: last}

          - uid: k8s-pod-imagepull
            title: "Pod Image Pull Error"
            condition: C
            noDataState: NoData
            execErrState: Error
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: 'Pod Image Pull Error: {{ "{{" }} $labels.pod {{ "}}" }} ({{ "{{" }} $labels.namespace {{ "}}" }})'
              description: 'Cluster: {{ "{{" }} $labels.cluster {{ "}}" }} | Namespace: {{ "{{" }} $labels.namespace {{ "}}" }} | Pod: {{ "{{" }} $labels.pod {{ "}}" }} | Container: {{ "{{" }} $labels.container {{ "}}" }} | Reason: {{ "{{" }} $labels.reason {{ "}}" }} — Check image name/tag and registry credentials. Verify the image exists and the pull secret is correct.'
            data:
              - refId: A
                relativeTimeRange: {from: 300, to: 0}
                datasourceUid: mimir
                model:
                  expr: 'kube_pod_container_status_waiting_reason{reason=~"ImagePullBackOff|ErrImagePull"}'
                  instant: true
                  range: false
                  refId: A
              - refId: C
                relativeTimeRange: {from: 0, to: 0}
                datasourceUid: __expr__
                model:
                  type: threshold
                  refId: C
                  expression: A
                  conditions:
                    - evaluator: {params: [0], type: gt}
                      operator: {type: and}
                      query: {params: [A]}
                      reducer: {params: [], type: last}

          - uid: k8s-pod-restart-rate
            title: "Pod Restart Rate High"
            condition: C
            noDataState: NoData
            execErrState: Error
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: 'High Restart Rate: {{ "{{" }} $labels.cluster {{ "}}" }} / {{ "{{" }} $labels.namespace {{ "}}" }} / {{ "{{" }} $labels.pod {{ "}}" }}'
              description: 'Cluster: {{ "{{" }} $labels.cluster {{ "}}" }} | Namespace: {{ "{{" }} $labels.namespace {{ "}}" }} | Pod: {{ "{{" }} $labels.pod {{ "}}" }} — more than 3 restarts in 15 minutes. Likely entering CrashLoopBackOff, check pod logs immediately.'
            data:
              - refId: A
                relativeTimeRange: {from: 900, to: 0}
                datasourceUid: mimir
                model:
                  expr: 'sum by (cluster, namespace, pod) (increase(kube_pod_container_status_restarts_total[15m]))'
                  instant: true
                  range: false
                  refId: A
              - refId: C
                relativeTimeRange: {from: 0, to: 0}
                datasourceUid: __expr__
                model:
                  type: threshold
                  refId: C
                  expression: A
                  conditions:
                    - evaluator: {params: [3], type: gt}
                      operator: {type: and}
                      query: {params: [A]}
                      reducer: {params: [], type: last}

      # ── Monitoring Stack Self-Health ─────────────────────────────────────────
      # Uses kube-state-metrics deployment/statefulset availability rather than an
      # `up{job=~"..."}` scrape check — Mimir/Loki/Tempo aren't scraped under those
      # job names, so that pattern silently matches nothing and never fires.
      - orgId: 1
        name: monitoring-stack
        folder: Infrastructure
        interval: 1m
        rules:
          - uid: mimir-down
            title: "Mimir Down"
            condition: C
            noDataState: Alerting
            execErrState: Alerting
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "Mimir Down"
              description: "mimir-distributor deployment has unavailable replicas for 2m — Mimir metrics ingestion may be degraded"
            data:
              - refId: A
                relativeTimeRange: {from: 300, to: 0}
                datasourceUid: mimir
                model:
                  expr: 'max(kube_deployment_status_replicas_unavailable{deployment="mimir-distributor",namespace="monitoring"})'
                  instant: true
                  range: false
                  refId: A
              - refId: C
                relativeTimeRange: {from: 0, to: 0}
                datasourceUid: __expr__
                model:
                  type: threshold
                  refId: C
                  expression: A
                  conditions:
                    - evaluator: {params: [0], type: gt}
                      operator: {type: and}
                      query: {params: [A]}
                      reducer: {params: [], type: last}

          - uid: loki-down
            title: "Loki Down"
            condition: C
            noDataState: Alerting
            execErrState: Alerting
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "Loki Down"
              description: "loki-gateway deployment has unavailable replicas for 2m — log ingestion or querying may be down"
            data:
              - refId: A
                relativeTimeRange: {from: 300, to: 0}
                datasourceUid: mimir
                model:
                  expr: 'max(kube_deployment_status_replicas_unavailable{deployment="loki-gateway",namespace="monitoring"})'
                  instant: true
                  range: false
                  refId: A
              - refId: C
                relativeTimeRange: {from: 0, to: 0}
                datasourceUid: __expr__
                model:
                  type: threshold
                  refId: C
                  expression: A
                  conditions:
                    - evaluator: {params: [0], type: gt}
                      operator: {type: and}
                      query: {params: [A]}
                      reducer: {params: [], type: last}

          - uid: tempo-down
            title: "Tempo Down"
            condition: C
            noDataState: Alerting
            execErrState: Alerting
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "Tempo Down"
              description: "Tempo StatefulSet has no ready replicas for 2m — trace ingestion and querying is down"
            data:
              - refId: A
                relativeTimeRange: {from: 300, to: 0}
                datasourceUid: mimir
                model:
                  expr: 'min(kube_statefulset_status_replicas_ready{statefulset="tempo",namespace="monitoring"})'
                  instant: true
                  range: false
                  refId: A
              - refId: C
                relativeTimeRange: {from: 0, to: 0}
                datasourceUid: __expr__
                model:
                  type: threshold
                  refId: C
                  expression: A
                  conditions:
                    - evaluator: {params: [1], type: lt}
                      operator: {type: and}
                      query: {params: [A]}
                      reducer: {params: [], type: last}

      # ── Cluster Telemetry Health ─────────────────────────────────────────────
      # Detects loss of metrics scraping per cluster. Proxy metric: if the cluster's
      # Alloy agent stops, node-exporter targets go absent/down — a direct
      # absent(up{job="..."}) check is unreliable since that job name may never
      # have existed as a distinct scrape target.
      - orgId: 1
        name: alloy-health
        folder: Infrastructure
        interval: 1m
        rules:
          - uid: hub-telemetry-lost
            title: "Hub Telemetry Lost"
            condition: C
            noDataState: Alerting
            execErrState: Alerting
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: 'Hub metrics collection stopped'
              description: 'Cluster: hub — node-exporter scrape targets are down or absent. Check hub-alloy DaemonSet in the monitoring namespace on the hub cluster.'
            data:
              - refId: A
                relativeTimeRange: {from: 600, to: 0}
                datasourceUid: mimir
                model:
                  expr: 'min(up{job="node-exporter",cluster="hub"})'
                  instant: true
                  range: false
                  refId: A
              - refId: C
                relativeTimeRange: {from: 0, to: 0}
                datasourceUid: __expr__
                model:
                  type: threshold
                  refId: C
                  expression: A
                  conditions:
                    - evaluator: {params: [1], type: lt}
                      operator: {type: and}
                      query: {params: [A]}
                      reducer: {params: [], type: last}

          # Add one entry per spoke cluster — update the cluster label to match your spoke
          - uid: spoke-1-telemetry-lost
            title: "spoke-1 Telemetry Lost"
            condition: C
            noDataState: Alerting
            execErrState: Alerting
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: 'spoke-1 metrics collection stopped'
              description: 'Cluster: spoke-1 — node-exporter scrape targets are down or absent. Check spoke-alloy DaemonSet on that cluster.'
            data:
              - refId: A
                relativeTimeRange: {from: 600, to: 0}
                datasourceUid: mimir
                model:
                  expr: 'min(up{job="node-exporter",cluster="spoke-1"})'   # update cluster label to match your deployment
                  instant: true
                  range: false
                  refId: A
              - refId: C
                relativeTimeRange: {from: 0, to: 0}
                datasourceUid: __expr__
                model:
                  type: threshold
                  refId: C
                  expression: A
                  conditions:
                    - evaluator: {params: [1], type: lt}
                      operator: {type: and}
                      query: {params: [A]}
                      reducer: {params: [], type: last}

      # ── Application Error Alerts ─────────────────────────────────────────────
      # Dynamic — covers any service exposing http_server_requests_seconds (Micrometer/Spring Boot).
      # Add an equivalent group for other frameworks' request-duration metrics if needed.
      - orgId: 1
        name: app-errors
        folder: Applications
        interval: 1m
        rules:
          - uid: app-high-error-rate
            title: "App High Error Rate (>5%)"
            condition: C
            # OK, not NoData: bursty traffic can legitimately leave the 5m rate() window
            # empty during quiet periods. NoData would otherwise fire a notification on
            # every gap; the rule still fires normally the moment real >5% error data appears.
            noDataState: OK
            execErrState: Error
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: 'High Error Rate: {{ "{{" }} $labels.cluster {{ "}}" }} / {{ "{{" }} $labels.namespace {{ "}}" }} / {{ "{{" }} $labels.service {{ "}}" }}'
              description: 'HTTP 5xx error rate exceeded 5% for 5 minutes. Cluster: {{ "{{" }} $labels.cluster {{ "}}" }} | Namespace: {{ "{{" }} $labels.namespace {{ "}}" }} | Service: {{ "{{" }} $labels.service {{ "}}" }} — Check application logs and recent deployments.'
            data:
              - refId: A
                relativeTimeRange: {from: 600, to: 0}
                datasourceUid: mimir
                model:
                  expr: '(sum by (cluster, namespace, service) (rate(http_server_requests_seconds_count{status=~"5.."}[5m])) or 0 * sum by (cluster, namespace, service) (rate(http_server_requests_seconds_count[5m]))) / (sum by (cluster, namespace, service) (rate(http_server_requests_seconds_count[5m])) > 0)'
                  instant: true
                  range: false
                  refId: A
              - refId: C
                relativeTimeRange: {from: 0, to: 0}
                datasourceUid: __expr__
                model:
                  type: threshold
                  refId: C
                  expression: A
                  conditions:
                    - evaluator: {params: [0.05], type: gt}
                      operator: {type: and}
                      query: {params: [A]}
                      reducer: {params: [], type: last}

          - uid: app-high-latency
            title: "App High Latency p99 (>2s)"
            condition: C
            # OK, not NoData: same bursty-traffic reasoning as app-high-error-rate above.
            noDataState: OK
            execErrState: Error
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: 'High Latency p99: {{ "{{" }} $labels.cluster {{ "}}" }} / {{ "{{" }} $labels.namespace {{ "}}" }} / {{ "{{" }} $labels.service {{ "}}" }}'
              description: 'p99 response time exceeded 2 seconds for 5 minutes. Cluster: {{ "{{" }} $labels.cluster {{ "}}" }} | Namespace: {{ "{{" }} $labels.namespace {{ "}}" }} | Service: {{ "{{" }} $labels.service {{ "}}" }} — Profile the service and check for slow database queries or resource contention.'
            data:
              - refId: A
                relativeTimeRange: {from: 600, to: 0}
                datasourceUid: mimir
                model:
                  expr: 'histogram_quantile(0.99, sum by (cluster, namespace, service, le) (rate(http_server_requests_seconds_bucket{}[5m]))) * 1000'
                  instant: true
                  range: false
                  refId: A
              - refId: C
                relativeTimeRange: {from: 0, to: 0}
                datasourceUid: __expr__
                model:
                  type: threshold
                  refId: C
                  expression: A
                  conditions:
                    - evaluator: {params: [2000], type: gt}
                      operator: {type: and}
                      query: {params: [A]}
                      reducer: {params: [], type: last}

# ── Ingress ───────────────────────────────────────────────────────────────────
ingress:
  enabled: true
  ingressClassName: nginx
  hosts:
    - hub-grafana.<YOUR_DOMAIN>
  tls:
    - secretName: hub-grafana-tls
      hosts:
        - hub-grafana.<YOUR_DOMAIN>
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    external-dns.alpha.kubernetes.io/target: "<YOUR_EXTERNAL_IP>"
